<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>簡報計時器</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="簡報計時">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#12151a;
    --bg-2:#181c22;
    --ink:#f2f4f7;
    --ink-dim:#7c8794;
    --line:#262c34;
    --run:#3fbfae;
    --warn:#e8a33d;
    --over:#d64550;
    --ring-track:#20262e;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
  }
  .stage{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:24px;
  }

  /* Landscape on short screens (phones/tablets rotated): the 92vh ring
     plus setup bar and controls no longer all fit vertically — shrink
     everything so the whole layout stays within view without scrolling. */
  @media (orientation:landscape) and (max-height:600px){
    .stage{padding:12px;}
    .setup{margin-bottom:10px;}
    .controls{margin-top:10px;}
    .hint{display:none;}
  }

  /* ---- setup bar ---- */
  .setup{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px 16px;
    margin-bottom:16px;
    transition:opacity .35s ease, transform .35s ease;
  }
  .setup.hidden{
    opacity:0;
    transform:translateY(-10px);
    pointer-events:none;
    height:0;
    margin:0;
    padding:0;
    overflow:hidden;
    border:none;
  }
  .setup label{
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .setup input{
    width:60px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    font-family:'SFMono-Regular','Consolas','Menlo','Courier New',monospace;
    font-size:20px;
    text-align:center;
    padding:4px 0;
  }
  .setup input:focus{outline:none;border-bottom-color:var(--run);}
  .setup .divider{width:1px;height:26px;background:var(--line);}
  .setup .presets{display:flex;gap:6px;}
  .preset-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
    transition:.15s;
  }
  .preset-btn:hover{border-color:var(--run);color:var(--ink);}

  /* ---- ring + clock ---- */
  .ring-wrap{
    position:relative;
    width:min(88vw,92vh);
    height:min(88vw,92vh);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  @media (orientation:landscape) and (max-height:600px){
    .ring-wrap{
      width:min(42vw,62vh);
      height:min(42vw,62vh);
    }
  }
  svg.ring{
    position:absolute;
    inset:0;
    transform:rotate(-90deg);
  }
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:3;}
  .ring-progress{
    fill:none;
    stroke:var(--run);
    stroke-width:3;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .4s ease;
  }
  .ring-wrap.warn .ring-progress{stroke:var(--warn);}
  .ring-wrap.over .ring-progress{stroke:var(--over);}

  .clock-core{
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
  }
  .sign{
    font-family:'SFMono-Regular','Consolas','Menlo','Courier New',monospace;
    font-size:clamp(20px,3vw,28px);
    font-weight:600;
    color:var(--over);
    height:1.4em;
    opacity:0;
    transition:opacity .3s ease;
    letter-spacing:.05em;
  }
  .sign.show{opacity:1;}
  .digits{
    font-family:'SFMono-Regular','Consolas','Menlo','Courier New',monospace;
    font-weight:700;
    font-size:clamp(120px,24vw,480px);
    line-height:1;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    transition:color .5s ease;
  }
  @media (orientation:landscape) and (max-height:600px){
    .digits{font-size:clamp(50px,10vw,180px);}
  }
  .ring-wrap.warn .digits{color:var(--warn);}
  .ring-wrap.over .digits{color:var(--over);}
  .status{
    margin-top:14px;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .ring-wrap.over .status{color:var(--over);}

  .flash{
    animation:flashOnce .9s ease;
  }
  @keyframes flashOnce{
    0%{transform:scale(1);}
    18%{transform:scale(1.06);}
    40%{transform:scale(1);}
  }

  /* ---- controls ---- */
  .controls{
    display:flex;
    gap:14px;
    margin-top:20px;
  }
  .ctrl-btn{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:16px;
    padding:16px 28px;
    min-width:104px;
    min-height:64px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:.15s;
    font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .ctrl-btn .icon{font-size:22px;line-height:1;}
  .ctrl-btn:hover{border-color:var(--run);}
  .ctrl-btn.primary{
    background:var(--run);
    border-color:var(--run);
    color:#08211d;
  }
  .ctrl-btn.primary:hover{filter:brightness(1.08);}
  .ctrl-btn.danger{
    color:var(--over);
  }
  .ctrl-btn.danger:hover{border-color:var(--over);}
  .ctrl-btn:active{transform:scale(.96);}
  .ctrl-btn:disabled{
    opacity:.32;
    cursor:default;
    transform:none;
    border-color:var(--line);
    background:var(--bg-2);
    color:var(--ink-dim);
  }
  .ctrl-btn:disabled:hover{border-color:var(--line);}

  .hint{
    position:absolute;
    bottom:20px;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:.04em;
  }

  .fs-btn{
    position:absolute;
    top:20px;
    right:20px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    width:36px;
    height:36px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s;
  }
  .fs-btn:hover{color:var(--ink);border-color:var(--run);}

  @media (prefers-reduced-motion: reduce){
    .ring-progress, .digits, .sign{transition:none;}
    .flash{animation:none;}
  }
</style>
</head>
<body style="background:#12151a;color:#f2f4f7;margin:0;">

<div class="stage">
  <button class="fs-btn" id="fsBtn" title="全螢幕">⤢</button>

  <div class="setup" id="setup">
    <label>分</label>
    <input type="number" id="minInput" value="5" min="0" max="180">
    <label>秒</label>
    <input type="number" id="secInput" value="0" min="0" max="59">
    <div class="divider"></div>
    <div class="presets">
      <button class="preset-btn" data-min="1">1分</button>
      <button class="preset-btn" data-min="3">3分</button>
      <button class="preset-btn" data-min="5">5分</button>
      <button class="preset-btn" data-min="10">10分</button>
      <button class="preset-btn" data-min="20">20分</button>
    </div>
  </div>

  <div class="ring-wrap" id="ringWrap">
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-track" cx="100" cy="100" r="92"></circle>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="92"
        stroke-dasharray="578.05" stroke-dashoffset="0"></circle>
    </svg>
    <div class="clock-core">
      <div class="sign" id="sign">超時 · OVERTIME</div>
      <div class="digits" id="digits">05:00</div>
      <div class="status" id="statusLabel">準備開始</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" id="startBtn"><span class="icon">▶</span>開始</button>
    <button class="ctrl-btn danger" id="resetBtn"><span class="icon">↻</span>重設</button>
  </div>

  <div class="hint">點畫面按鈕操作，或用空白鍵開始／暫停、R 鍵重設　·　點右上角切換全螢幕</div>
</div>

<script>
(function(){
  const CIRC = 2 * Math.PI * 92;
  const ringProgress = document.getElementById('ringProgress');
  const ringWrap = document.getElementById('ringWrap');
  const digitsEl = document.getElementById('digits');
  const signEl = document.getElementById('sign');
  const statusEl = document.getElementById('statusLabel');
  const setupEl = document.getElementById('setup');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const minInput = document.getElementById('minInput');
  const secInput = document.getElementById('secInput');
  const fsBtn = document.getElementById('fsBtn');

  ringProgress.style.strokeDasharray = CIRC.toFixed(2);

  let totalSeconds = 300;   // configured duration
  let remaining = 300;      // signed seconds; negative = overtime
  let running = false;
  let tickHandle = null;
  let hasFlashedOvertime = false;

  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }
  function beep(freq, startTime, duration){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.35, startTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }
  function playZeroAlert(){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    // three rising beeps to mark "time's up"
    beep(880, now, 0.16);
    beep(880, now + 0.24, 0.16);
    beep(1046, now + 0.48, 0.3);
  }
  function playOvertimeReminder(){
    // fires every 3 minutes into overtime — two calm-but-clear beeps
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    beep(740, now, 0.18);
    beep(740, now + 0.28, 0.18);
  }
  function playSevereOvertimeAlarm(){
    // fires at 15 min overtime (and every 3 min after) — urgent rapid high-pitch alarm
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    for(let i = 0; i < 8; i++){
      beep(1568, now + i * 0.14, 0.09);
    }
  }

  function fmt(sec){
    const s = Math.abs(sec);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }

  function render(){
    digitsEl.textContent = fmt(remaining);

    const overtime = remaining < 0;
    ringWrap.classList.toggle('over', overtime);

    if(overtime){
      signEl.classList.add('show');
      digitsEl.textContent = '+' + fmt(remaining);
      const otSec = -remaining;
      statusEl.textContent = otSec >= 900 ? '已嚴重超時' : '已超時';
      ringProgress.style.strokeDashoffset = '0';
      ringWrap.classList.remove('warn');
      if(!hasFlashedOvertime){
        digitsEl.classList.add('flash');
        setTimeout(()=>digitsEl.classList.remove('flash'), 900);
        hasFlashedOvertime = true;
      }
      return;
    }

    signEl.classList.remove('show');
    const frac = totalSeconds > 0 ? remaining / totalSeconds : 0;
    ringProgress.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);

    const warn = remaining <= 60 && remaining > 0;
    ringWrap.classList.toggle('warn', warn);

    if(!running && remaining === totalSeconds){
      statusEl.textContent = '準備開始';
    } else if(running){
      statusEl.textContent = warn ? '即將結束' : '進行中';
    } else {
      statusEl.textContent = '已暫停';
    }
  }

  function tick(){
    remaining -= 1;
    if(remaining === 0){
      playZeroAlert();
    } else if(remaining < 0){
      const otSec = -remaining;
      if(otSec % 180 === 0){
        if(otSec >= 900){
          playSevereOvertimeAlarm();
        } else {
          playOvertimeReminder();
        }
      }
    }
    render();
  }

  function start(){
    if(running) return;
    ensureAudio();
    running = true;
    setupEl.classList.add('hidden');
    startBtn.innerHTML = '<span class="icon">⏸</span>暫停';
    tickHandle = setInterval(tick, 1000);
    statusEl.textContent = '進行中';
  }

  function pause(){
    running = false;
    clearInterval(tickHandle);
    startBtn.innerHTML = '<span class="icon">▶</span>繼續';
    statusEl.textContent = '已暫停';
  }

  function reset(){
    running = false;
    clearInterval(tickHandle);
    hasFlashedOvertime = false;
    const m = Math.max(0, Math.min(180, parseInt(minInput.value,10) || 0));
    const s = Math.max(0, Math.min(59, parseInt(secInput.value,10) || 0));
    totalSeconds = m * 60 + s;
    remaining = totalSeconds;
    startBtn.innerHTML = '<span class="icon">▶</span>開始';
    setupEl.classList.remove('hidden');
    render();
  }

  startBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);

  document.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      minInput.value = btn.dataset.min;
      secInput.value = 0;
      reset();
    });
  });

  minInput.addEventListener('change', reset);
  secInput.addEventListener('change', reset);

  document.addEventListener('keydown', (e)=>{
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); running ? pause() : start(); }
    if(e.key === 'r' || e.key === 'R'){ reset(); }
  });

  fsBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  reset();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>

</body>
</html>
